{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "carpool.backend.fullname" . }}
  labels:
    {{- include "carpool.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
  JWT_SECRET: {{ .Values.backend.jwtSecret | quote }}
{{- end }}
