{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carpool.backend.fullname" . }}
  labels:
    {{- include "carpool.backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
  selector:
    {{- include "carpool.backend.selectorLabels" . | nindent 4 }}
{{- end }}
