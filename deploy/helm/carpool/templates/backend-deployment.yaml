{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carpool.backend.fullname" . }}
  labels:
    {{- include "carpool.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "carpool.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "carpool.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.mysql.enabled }}
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "carpool.mysql.fullname" . }} 3306; do
                echo "waiting for mysql..."
                sleep 3
              done
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ include "carpool.mysql.jdbcUrl" . | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SERVER_PORT
              value: {{ .Values.backend.port | quote }}
            - name: JWT_EXPIRY_HOURS
              value: {{ .Values.backend.jwtExpiryHours | quote }}
            - name: APP_FRONTEND_BASE_URL
              value: {{ include "carpool.publicBaseUrl" . | quote }}
            - name: APP_MAIL_ENABLED
              value: {{ .Values.backend.mailEnabled | quote }}
            - name: APP_CORS_EXTRA_ORIGIN_PATTERNS
              value: {{ .Values.backend.corsExtraOriginPatterns | quote }}
            - name: STRIPE_CURRENCY
              value: {{ .Values.backend.stripeCurrency | quote }}
            - name: STRIPE_SUCCESS_URL
              value: {{ printf "%s/payment-success" (include "carpool.publicBaseUrl" .) | quote }}
            - name: STRIPE_CANCEL_URL
              value: {{ printf "%s/payment-cancel" (include "carpool.publicBaseUrl" .) | quote }}
            - name: STRIPE_EXTRA_FRONTEND_ORIGINS
              value: {{ include "carpool.publicBaseUrl" . | quote }}
          envFrom:
            - secretRef:
                name: {{ include "carpool.backend.fullname" . }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
{{- end }}
