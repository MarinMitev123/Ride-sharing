# Namespace is created by the deploy script (default: carpool)
nameOverride: ""
fullnameOverride: ""

global:
  imagePullPolicy: IfNotPresent

namespace: carpool

mysql:
  enabled: true
  image: mysql:8.0
  database: carpool_db
  rootPassword: carpool-root-change-me
  storage: 5Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: carpool-backend
    tag: latest
  port: 8080
  jwtSecret: change-me-generate-a-long-random-secret
  jwtExpiryHours: 24
  mailEnabled: false
  corsExtraOriginPatterns: ""
  stripeCurrency: eur
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: carpool-frontend
    tag: latest
  port: 80
  # Empty = same-origin /api via Ingress
  viteApiUrl: ""
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m

ingress:
  enabled: true
  className: nginx
  # Public hostname, e.g. carpool.example.com or 123-45-67-89.nip.io
  host: ""
  annotations: {}

# Set by deploy script from ingress host, e.g. https://carpool.example.com
publicBaseUrl: http://localhost
